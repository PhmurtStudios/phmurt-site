<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Encounter Enemies — Preview v3</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Spectral:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #08080a; --bg-card: #141420; --border: rgba(255,255,255,0.11);
    --crimson: #d4433a; --text: #f2e8d6; --text-muted: #9a8870;
    --text-faint: #5a5040; --gold: #c9b458;
  }
  *,*::before,*::after{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Spectral',Georgia,serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:30px 20px;}
  .demo-wrap{width:100%;max-width:750px;}
  h1{font-family:'Cinzel',serif;color:var(--crimson);font-size:13px;letter-spacing:.12em;text-transform:uppercase;margin:0 0 16px 0;}

  /* Inputs */
  input[type="text"],select{background:var(--bg-card)!important;border:1px solid var(--border)!important;color:var(--text)!important;font-family:'Spectral',Georgia,serif;font-size:13px;padding:8px 10px;border-radius:6px;outline:none;transition:border-color .12s;}
  input[type="text"]:focus,select:focus{border-color:rgba(212,67,58,.5)!important;}

  /* ── Roster ──────────────────────────────────── */
  .cr-roster{margin-bottom:12px;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--bg-card);}
  .cr-roster-header{font-family:'Cinzel',serif;font-size:11px;font-weight:bold;letter-spacing:.05em;text-transform:uppercase;color:var(--gold);padding:10px 12px 6px;border-bottom:1px solid var(--border);}
  .cr-roster-row{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.04);font-size:13px;color:var(--text);}
  .cr-roster-row:last-child{border-bottom:none;}
  .cr-roster-info{display:flex;align-items:center;gap:8px;flex:1;min-width:0;}
  .cr-roster-name{font-family:'Cinzel',serif;font-size:14px;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cr-roster-badge{font-size:10px;font-weight:bold;font-family:'Cinzel',serif;color:var(--bg);padding:2px 8px;border-radius:12px;white-space:nowrap;flex-shrink:0;}
  .cr-roster-controls{display:flex;align-items:center;gap:4px;flex-shrink:0;margin-left:12px;}
  .cr-roster-btn{background:rgba(255,255,255,.08);border:1px solid var(--border);color:var(--text);width:28px;height:28px;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:4px;transition:background .1s;font-family:inherit;}
  .cr-roster-btn:hover{background:rgba(255,255,255,.14);}
  .cr-roster-remove{color:#d4433a;font-size:12px;}
  .cr-roster-remove:hover{background:rgba(212,67,58,.2);}
  .cr-roster-count{min-width:24px;text-align:center;font-weight:700;font-size:15px;font-family:'Cinzel',serif;}
  .cr-roster-xp{font-size:11px;color:var(--text-muted);min-width:56px;text-align:right;margin:0 6px;}
  .cr-autocalc{font-size:12px;color:var(--text-muted);padding:6px 2px;margin-bottom:10px;}
  .cr-autocalc strong{color:var(--text);font-weight:600;}

  /* ── Picker ──────────────────────────────────── */
  .cr-picker{border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--bg-card);}
  .cr-picker-toolbar{display:flex;gap:8px;padding:10px 12px;background:rgba(0,0,0,.18);border-bottom:1px solid var(--border);flex-wrap:wrap;align-items:center;}
  .cr-picker-search-wrap{position:relative;flex:1;min-width:180px;}
  .cr-picker-search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-faint);font-size:13px;pointer-events:none;}
  .cr-picker-search-wrap input[type="text"]{width:100%;padding-left:30px!important;}
  .cr-picker-toolbar select{min-width:80px;}
  .cr-picker-filters{display:flex;gap:6px;padding:8px 12px;flex-wrap:wrap;border-bottom:1px solid var(--border);background:rgba(0,0,0,.08);}
  .cr-filter-pill{padding:4px 12px;border-radius:16px;cursor:pointer;font-size:11px;font-family:'Cinzel',serif;border:1px solid var(--border);background:transparent;color:var(--text-muted);transition:all .15s;white-space:nowrap;}
  .cr-filter-pill:hover{border-color:rgba(212,67,58,.4);color:var(--text);}
  .cr-filter-pill.active{border-color:var(--crimson);background:var(--crimson);color:var(--bg);}
  .cr-picker-count{font-size:11px;color:var(--text-muted);padding:5px 12px 3px;font-family:'Cinzel',serif;letter-spacing:.03em;}
  .cr-picker-list{max-height:500px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.12) transparent;}
  .cr-picker-list::-webkit-scrollbar{width:6px;}
  .cr-picker-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:3px;}

  /* ── Monster row ─────────────────────────────── */
  .cr-mp-row{display:flex;align-items:center;border-bottom:1px solid rgba(255,255,255,.04);transition:background .1s;}
  .cr-mp-row:last-of-type{border-bottom:none;}
  .cr-mp-row:hover{background:rgba(255,255,255,.03);}
  .cr-mp-row-main{display:flex;align-items:center;flex:1;padding:10px 12px;cursor:pointer;gap:10px;min-width:0;}
  .cr-mp-row-main:hover{background:rgba(212,67,58,.06);}
  .cr-mp-cr-stripe{width:3px;align-self:stretch;flex-shrink:0;border-radius:2px;}
  .cr-mp-badge{font-size:10px;font-weight:bold;font-family:'Cinzel',serif;color:var(--bg);padding:2px 8px;border-radius:12px;white-space:nowrap;flex-shrink:0;}
  .cr-mp-name{font-family:'Cinzel',serif;font-size:13px;color:var(--gold);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cr-mp-meta{display:flex;gap:12px;font-size:11px;color:var(--text-muted);flex-shrink:0;align-items:center;}
  .cr-mp-meta-item{white-space:nowrap;}
  .cr-mp-hb-tag{font-family:'Cinzel',serif;font-size:9px;letter-spacing:.08em;color:var(--gold);background:rgba(201,180,88,.1);padding:1px 6px;border-radius:8px;}
  .cr-mp-add-btn{background:transparent;border:1px solid var(--border);color:var(--text-muted);padding:4px 10px;font-size:11px;font-family:'Cinzel',serif;border-radius:4px;cursor:pointer;transition:all .12s;flex-shrink:0;margin-right:4px;}
  .cr-mp-add-btn:hover{border-color:var(--crimson);color:var(--crimson);background:rgba(212,67,58,.08);}
  .cr-mp-expand-btn{background:none;border:none;color:var(--text-faint);cursor:pointer;padding:10px 12px 10px 6px;font-size:14px;transition:color .1s,transform .2s;flex-shrink:0;display:flex;align-items:center;}
  .cr-mp-expand-btn:hover{color:var(--text);}
  .cr-mp-expand-btn.open{transform:rotate(90deg);}

  /* ── STAT BLOCK (traditional D&D style) ──────── */
  .cr-statblock-wrap{display:none;border-bottom:1px solid rgba(255,255,255,.06);background:rgba(0,0,0,.15);padding:12px 14px 14px 14px;}
  .cr-statblock-wrap.open{display:block;}

  .cr-statblock{
    max-width:420px; margin:0 auto;
    background:var(--bg-card); border:1px solid var(--border);
    border-top:3px solid var(--crimson); border-bottom:3px solid var(--crimson);
    padding:16px 18px; font-family:'Spectral',serif; font-size:12px;
    color:var(--text); line-height:1.5; position:relative;
  }
  .cr-statblock::before,.cr-statblock::after{
    content:''; position:absolute; left:12px; right:12px; height:1px;
    background:linear-gradient(90deg,transparent,var(--crimson),transparent);
  }
  .cr-statblock::before{top:0;}
  .cr-statblock::after{bottom:0;}

  .cr-sb-name{font-family:'Cinzel',serif;font-size:18px;color:var(--crimson);margin:0 0 0 0;font-weight:700;line-height:1.2;}
  .cr-sb-subtitle{font-size:11px;font-style:italic;color:var(--text-muted);margin:0 0 10px 0;}
  .cr-sb-divider{border:none;border-top:2px solid var(--crimson);margin:8px 0;opacity:.4;}
  .cr-sb-prop{margin:2px 0;}
  .cr-sb-prop-label{color:var(--crimson);font-weight:700;}

  .cr-sb-abilities{display:flex;justify-content:space-around;text-align:center;margin:6px 0;padding:6px 0;border-top:1px solid rgba(212,67,58,.2);border-bottom:1px solid rgba(212,67,58,.2);}
  .cr-sb-ability{display:flex;flex-direction:column;align-items:center;gap:1px;}
  .cr-sb-ability-label{font-family:'Cinzel',serif;font-size:10px;font-weight:700;color:var(--crimson);letter-spacing:.04em;}
  .cr-sb-ability-val{font-size:12px;color:var(--text);}

  .cr-sb-section-title{font-family:'Cinzel',serif;font-size:13px;color:var(--crimson);margin:10px 0 4px;font-weight:700;border-bottom:1px solid rgba(212,67,58,.15);padding-bottom:2px;}
  .cr-sb-trait{margin:4px 0;}
  .cr-sb-trait-name{font-style:italic;font-weight:700;color:var(--text);}

  .cr-mp-empty{padding:40px 20px;text-align:center;color:var(--text-muted);font-style:italic;font-size:14px;}
  .cr-mp-empty-icon{font-size:40px;margin-bottom:12px;opacity:.2;}
</style>
</head>
<body>

<div class="demo-wrap">
  <h1>Enemies <span style="font-weight:400;font-size:11px;opacity:.5;text-transform:none;letter-spacing:0;">search &amp; click to add</span></h1>

        <input type="text" id="mp-search" placeholder="Search monsters…" autocomplete="off" />

      <button class="cr-filter-pill" data-filter="type" data-val="humanoid">Humanoid</button>
      <button class="cr-filter-pill" data-filter="type" data-val="monstrosity">Monstrosity</button>
      <button class="cr-filter-pill" data-filter="type" data-val="ooze">Ooze</button>
      <button class="cr-filter-pill" data-filter="type" data-val="plant">Plant</button>
      <button class="cr-filter-pill" data-filter="type" data-val="undead">Undead</button>
    </div>
    <div class="cr-picker-filters">
      <span style="font-size:10px;color:var(--text-faint);font-family:'Cinzel',serif;letter-spacing:.05em;align-self:center;margin-right:4px;">SIZE</span>
      <button class="cr-filter-pill active" data-filter="size" data-val="">All</button>
      <button class="cr-filter-pill" data-filter="size" data-val="tiny">Tiny</button>
      <button class="cr-filter-pill" data-filter="size" data-val="small">Small</button>
      <button class="cr-filter-pill" data-filter="size" data-val="medium">Medium</button>
      <button class="cr-filter-pill" data-filter="size" data-val="large">Large</button>
      <button class="cr-filter-pill" data-filter="size" data-val="huge">Huge</button>
      <button class="cr-filter-pill" data-filter="size" data-val="gargantuan">Gargantuan</button>
    </div>
    <div class="cr-picker-filters">
      <span style="font-size:10px;color:var(--text-faint);font-family:'Cinzel',serif;letter-spacing:.05em;align-self:center;margin-right:4px;">SOURCE</span>
      <button class="cr-filter-pill active" data-filter="source" data-val="">All</button>
      <button class="cr-filter-pill" data-filter="source" data-val="SRD">SRD</button>
      <button class="cr-filter-pill" data-filter="source" data-val="Homebrew">Homebrew</button>
    </div>
    <div class="cr-picker-count" id="mp-count"></div>
    <div class="cr-picker-list" id="mp-list"></div>
  </div>
</div>

/* ── Stat block renderer ──────────────────────── */
function renderStatBlock(m){
  var xp=CR_XP[m.cr]||0;
  var html='<div class="cr-statblock">';
  html+='<div class="cr-sb-name">'+esc(m.name)+'</div>';
  html+='<div class="cr-sb-subtitle">'+cap(m.size)+' '+m.type+', '+m.align+'</div>';
  html+='<hr class="cr-sb-divider" />';
  html+='<div class="cr-sb-prop"><span class="cr-sb-prop-label">Armor Class</span> '+m.ac+'</div>';
  html+='<div class="cr-sb-prop"><span class="cr-sb-prop-label">Hit Points</span> '+esc(m.hp)+'</div>';
  html+='<div class="cr-sb-prop"><span class="cr-sb-prop-label">Speed</span> '+esc(m.spd)+'</div>';
  html+='<hr class="cr-sb-divider" />';
  html+='<div class="cr-sb-abilities">';
  ['STR','DEX','CON','INT','WIS','CHA'].forEach(function(ab,i){
    var key=['str','dex','con','int','wis','cha'][i];
    var val=m[key]||10;
    html+='<div class="cr-sb-ability"><div class="cr-sb-ability-label">'+ab+'</div><div class="cr-sb-ability-val">'+val+' ('+fmtMod(val)+')</div></div>';
  });
  html+='</div>';
  html+='<hr class="cr-sb-divider" />';
  if(m.saves) html+='<div class="cr-sb-prop"><span class="cr-sb-prop-label">Saving Throws</span> '+esc(m.saves)+'</div>';
  if(m.skills) html+='<div class="cr-sb-prop"><span class="cr-sb-prop-label">Skills</span> '+esc(m.skills)+'</div>';
  if(m.senses) html+='<div class="cr-sb-prop"><span class="cr-sb-prop-label">Senses</span> '+esc(m.senses)+'</div>';
  if(m.lang) html+='<div class="cr-sb-prop"><span class="cr-sb-prop-label">Languages</span> '+esc(m.lang)+'</div>';
  html+='<div class="cr-sb-prop"><span class="cr-sb-prop-label">Challenge</span> '+esc(m.cr)+' ('+xp.toLocaleString()+' XP)</div>';
  if(m.traits&&m.traits.length){
    html+='<hr class="cr-sb-divider" />';
    m.traits.forEach(function(t){html+='<div class="cr-sb-trait"><span class="cr-sb-trait-name">'+esc(t.n)+'.</span> '+esc(t.d)+'</div>';});
  }
  if(m.actions&&m.actions.length){
    html+='<div class="cr-sb-section-title">Actions</div>';
    m.actions.forEach(function(a){html+='<div class="cr-sb-trait"><span class="cr-sb-trait-name">'+esc(a.n)+'.</span> '+esc(a.d)+'</div>';});
  }
  if(m.legendary&&m.legendary.length){
    html+='<div class="cr-sb-section-title">Legendary Actions</div>';
    html+='<div style="font-size:11px;color:var(--text-muted);margin-bottom:4px;font-style:italic;">The creature can take 3 legendary actions, choosing from the options below. Only one can be used at a time and only at the end of another creature\'s turn. Spent legendary actions are regained at the start of each turn.</div>';
    m.legendary.forEach(function(la){html+='<div class="cr-sb-trait"><span class="cr-sb-trait-name">'+esc(la.n)+'.</span> '+esc(la.d)+'</div>';});
  }
  html+='</div>';
  return html;
}

/* ── Roster ───────────────────────────────────── */
function renderRoster(){
  var el=document.getElementById('roster'), xpEl=document.getElementById('xp-summary');
  if(!encounter.length){el.style.display='none';xpEl.innerHTML='Total: 0 monsters · 0 XP';return;}
  el.style.display='';
  var totalXp=0,totalCount=0;
  var html='<div class="cr-roster-header">Current Encounter</div>';
  encounter.forEach(function(m,i){
    var xp=CR_XP[m.cr]||0,col=crColor(m.cr),rowXp=(m.count||1)*xp;
    totalXp+=rowXp;totalCount+=(m.count||1);
    html+='<div class="cr-roster-row" style="border-left:3px solid '+col+'"><div class="cr-roster-info"><span class="cr-roster-name">'+esc(m.name)+'</span><span class="cr-roster-badge" style="background:'+col+'">CR '+esc(m.cr)+'</span></div><div class="cr-roster-controls"><button class="cr-roster-btn" onclick="decMonster('+i+')">−</button><span class="cr-roster-count">'+(m.count||1)+'</span><button class="cr-roster-btn" onclick="incMonster('+i+')">+</button><span class="cr-roster-xp">'+rowXp+' XP</span><button class="cr-roster-btn cr-roster-remove" onclick="removeMonster('+i+')">✕</button></div></div>';
  });
  el.innerHTML=html;
  var mult=totalCount<=1?1:totalCount===2?1.5:totalCount<=6?2:totalCount<=10?2.5:totalCount<=14?3:4;
  xpEl.innerHTML='Total: '+totalCount+' monster(s) · raw '+totalXp+' XP × '+mult+' = <strong>'+Math.round(totalXp*mult)+' adj XP</strong>';
}
function incMonster(i){encounter[i].count=(encounter[i].count||1)+1;renderRoster();}
function decMonster(i){var c=(encounter[i].count||1)-1;if(c<1)encounter.splice(i,1);else encounter[i].count=c;renderRoster();}
function removeMonster(i){encounter.splice(i,1);renderRoster();}
function addMonster(name,cr){var ex=-1;encounter.forEach(function(m,i){if(m.name===name&&m.cr===cr)ex=i;});if(ex>=0)encounter[ex].count=(encounter[ex].count||1)+1;else encounter.push({name:name,cr:cr,count:1});renderRoster();}

function renderGrid(){
  var q=(document.getElementById('mp-search').value||'').toLowerCase().trim();
  var crF=document.getElementById('mp-cr').value;
  var sortV=document.getElementById('mp-sort').value;
  var listEl=document.getElementById('mp-list');
  var countEl=document.getElementById('mp-count');
  var filtered=allMonsters.filter(function(m){
    if(q&&m.name.toLowerCase().indexOf(q)===-1)return false;
    if(crF&&m.cr!==crF)return false;
    if(filters.type&&m.type!==filters.type)return false;
    if(filters.size&&m.size!==filters.size)return false;
    if(filters.source&&m.source!==filters.source)return false;
    return true;
  });
  filtered.sort(function(a,b){
    if(sortV==='cr-asc')return crToNum(a.cr)-crToNum(b.cr)||a.name.localeCompare(b.name);
    if(sortV==='cr-desc')return crToNum(b.cr)-crToNum(a.cr)||a.name.localeCompare(b.name);
    if(sortV==='xp')return(CR_XP[b.cr]||0)-(CR_XP[a.cr]||0)||a.name.localeCompare(b.name);
    return a.name.localeCompare(b.name);
  });
  countEl.textContent=filtered.length+' monster'+(filtered.length!==1?'s':'');
  if(!filtered.length){listEl.innerHTML='<div class="cr-mp-empty"><div class="cr-mp-empty-icon">&#9737;</div><div>No monsters match your filters</div></div>';return;}

  listEl.innerHTML=filtered.map(function(m){
    var xp=CR_XP[m.cr]||0,col=crColor(m.cr),isOpen=(expandedName===m.name);
    return '<div class="cr-mp-row">'+
      '<div class="cr-mp-cr-stripe" style="background:'+col+'"></div>'+
      '<div class="cr-mp-row-main" data-add-name="'+esc(m.name)+'" data-add-cr="'+esc(m.cr)+'">'+
        '<span class="cr-mp-badge" style="background:'+col+'">CR '+esc(m.cr)+'</span>'+
        '<span class="cr-mp-name">'+esc(m.name)+'</span>'+
        '<span class="cr-mp-meta">'+
          '<span class="cr-mp-meta-item">'+cap(m.type)+'</span>'+
          '<span class="cr-mp-meta-item">'+cap(m.size)+'</span>'+
          '<span class="cr-mp-meta-item">'+xp+' XP</span>'+
          (m.source==='Homebrew'?'<span class="cr-mp-hb-tag">HB</span>':'')+
        '</span>'+
        '<button class="cr-mp-add-btn" data-add-name="'+esc(m.name)+'" data-add-cr="'+esc(m.cr)+'">+ Add</button>'+
      '</div>'+
      '<button class="cr-mp-expand-btn'+(isOpen?' open':'')+'" data-expand="'+esc(m.name)+'">&#9654;</button>'+
    '</div>'+
    '<div class="cr-statblock-wrap'+(isOpen?' open':'')+'" data-detail="'+esc(m.name)+'">'+
      renderStatBlock(m)+
    '</div>';
  }).join('');
}

/* Events */
document.getElementById('mp-search').addEventListener('input',renderGrid);
document.getElementById('mp-cr').addEventListener('change',renderGrid);
document.getElementById('mp-sort').addEventListener('change',renderGrid);

document.querySelectorAll('.cr-filter-pill').forEach(function(pill){
  pill.addEventListener('click',function(){
    var fKey=this.getAttribute('data-filter'),fVal=this.getAttribute('data-val');
    filters[fKey]=fVal;
    this.parentElement.querySelectorAll('.cr-filter-pill[data-filter="'+fKey+'"]').forEach(function(p){p.classList.toggle('active',p.getAttribute('data-val')===fVal);});
    renderGrid();
  });
});

document.getElementById('mp-list').addEventListener('click',function(e){
  var expBtn=e.target.closest('.cr-mp-expand-btn');
  if(expBtn){expandedName=(expandedName===expBtn.getAttribute('data-expand'))?null:expBtn.getAttribute('data-expand');renderGrid();return;}
  var addEl=e.target.closest('[data-add-name]');
  if(addEl){addMonster(addEl.getAttribute('data-add-name'),addEl.getAttribute('data-add-cr'));return;}
});

renderGrid();renderRoster();
</script>
</body>
</html>
